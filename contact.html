<body>

    <header>
        <h1>Adelina Jorge</h1>
        <nav>
            <ul>

                <li><a href="contact.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contacto-form">
            <h2>Fala Comigo</h2>
            <form action="#" method="post">

                <fieldset>
                    <legend>Dados Pessoais</legend>

                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required minlength="3">

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" pattern="[0-9]{9}" placeholder="8XXXXXXXX">

                    <label for="data">Data preferida de contacto:</label>
                    <input type="date" id="data" name="data">

                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" min="15" max="99">
                </fieldset>

                <fieldset>
                    <legend>Detalhes da Mensagem</legend>

                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto">
                        <option value="projeto">Proposta de Projeto</option>
                        <option value="emprego">Oportunidade de Emprego</option>
                        <option value="outro">Outro</option>
                    </select>

                    <p>Como prefere ser contactado?</p>
                    <label><input type="radio" name="contacto-pref" value="email" checked> Email</label>
                    <label><input type="radio" name="contacto-pref" value="telefone"> Telefone</label>

                    <label for="cv">Anexar CV:</label>
                    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx">

                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
                </fieldset>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Email: adelinaj907@gmail.com | Tel: 875476443 | Instagram: @adelinajorge</p>
        <p>Desenvolvido por Adelina Jorge</p>
    </footer>

</body>
</html>
